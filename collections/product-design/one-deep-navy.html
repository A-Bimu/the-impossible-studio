function expenses(){let arr=state.tx.filter(t=>t.kind==='expense');return `<div class="panel"><div class="panel-head"><div><h3>Recorded business expenses</h3><p>Operational outflows, separate from customer sales</p></div></div>${txTable(arr)}</div>`}
function team(){return `<div class="panel"><div class="panel-head"><div><h3>Team directory</h3><p>Demo role labels only. A production system must enforce permissions on the server.</p></div></div><div class="table-wrap"><table><thead><tr><th>Team member</th><th>Role</th><th>Access profile</th><th></th></tr></thead><tbody>${state.staff.map((s,i)=>`<tr><td class="txn-name">${safe(s.name)}</td><td>${safe(s.role)}</td><td>${safe(s.access)}</td><td><button class="plain-link" data-editstaff="${i}">Edit</button></td></tr>`).join('')}</tbody></table></div></div>`}
function reports(){let t=totals(),n=t.collected-t.expense;let vals=[14,27,19,39,23,45,31,Math.max(t.collected/200,8)],mx=Math.max(...vals)*1.15;return `<div class="report-stats"><div class="report-stat"><p>Confirmed sales</p><strong>${currency(t.collected)}</strong></div><div class="report-stat"><p>Business expenses</p><strong>${currency(t.expense)}</strong></div><div class="report-stat"><p>Sales less expenses</p><strong>${currency(n)}</strong></div></div><div class="split"><div class="panel analytics"><div class="panel-head" style="padding:0 0 10px"><div><h3>Sales at a glance</h3><p>Illustrative trend · Recent periods are demonstration placeholders</p></div></div><div class="bars">${vals.map((v,i)=>`<div class="bar-item"><div class="bar" style="height:${Math.max(v/mx*100,5)}%"></div><span>${['M','T','W','T','F','S','S','Now'][i]}</span></div>`).join('')}</div><p class="chart-caption">Only the "Now" amount responds to demo records. Earlier bars are illustrative.</p></div><div class="panel attention"><h3>Payment methods</h3>${[['M-PESA',t.mpesa],['Cash',t.cash],['Other confirmed',Math.max(0,t.collected-t.mpesa-t.cash)],['Pending verification',t.pending]].map(([n,a])=>`<div class="shift-row"><span>${n}</span><b>${currency(a)}</b></div>`).join('')}<div class="box-note" style="margin-top:16px">Sales less recorded expenses is not accounting profit. It excludes cost of goods, taxes, and other unrecorded obligations.</div></div></div>`}
function settings(){return `<div class="split"><div class="panel" style="padding:22px"><h3 style="margin:0 0 20px">Business profile</h3><div class="form-block"><label class="form-label">Business name</label><input class="field" id="businessName" value="${safe(state.company)}"></div><div class="form-block"><label class="form-label">Branch</label><input class="field" id="branchName" value="${safe(state.branch)}"></div><div class="form-block"><label class="form-label">Business type</label><div class="pill-base">${safe(template[state.type].name)}</div></div><button class="btn primary" data-act="saveSettings">${ic('check')} Save details</button><button class="btn" style="margin-left:7px" data-act="switch">Change business type</button></div><div class="panel" style="padding:22px"><h3 style="margin:0 0 16px">Workspace modules</h3>${[['inventory',template[state.type].stock,'Catalogues and stock'],['customers','Customers','Contact directory'],['team','Team','Staff list'],['reports','Reports','Sales and expense reporting']].map(([k,n,d])=>`<div class="pref-row"><div><strong>${safe(n)}</strong><small>${d}</small></div><button class="toggle ${state.config?.[k]?'on':''}" data-toggle="${k}" aria-label="Toggle ${safe(n)}"></button></div>`).join('')}<div class="box-note" style="margin-top:19px">This is a local prototype. Modules are display preferences only and do not provide data security or access controls.</div><button class="btn danger" style="margin-top:12px" data-act="reset">Reset demo data</button></div></div>`}
function render(){let content=({overview,sell,activity,customers,inventory,expenses,team,reports,settings})[ui.page]();document.getElementById('app').innerHTML=shell(content);renderPortal()}
function modal(title,desc,body,buttons=''){return `<div class="modal-shade"><section class="modal" role="dialog" aria-modal="true" aria-label="${safe(title)}"><div class="modal-head"><div><h2>${safe(title)}</h2><p>${safe(desc)}</p></div><button class="modal-close" data-act="closeModal" aria-label="Close">${ic('close',20)}</button></div><div class="modal-body">${body}</div>${buttons?`<div class="modal-actions">${buttons}</div>`:''}</section></div>`}
function renderPortal(){let m=ui.modal;let html='';if(m){let type=m.type;let cancel='<button class="btn" data-act="closeModal">Cancel</button>';if(type==='switch'){html=modal('Choose business type','Your workspace will adapt to the way you operate.',`<div class="mode-grid">${Object.entries(template).map(([k,x])=>`<button data-business="${k}" class="mode-option ${state.type===k?'chosen':''}">${ic(k==='retail'?'box':k==='salon'?'users':k==='restaurant'?'receipt':'layers',23)}<strong>${safe(x.name)}</strong><small>${k==='retail'?'Products, selling and inventory':k==='salon'?'Clients and bookable services':k==='restaurant'?'Menu items and order checkout':'Service catalogue and invoices'}</small></button>`).join('')}</div><p class="small-print">Selecting a new type resets this local demonstration to matching sample records.</p>`,cancel)}
else if(type==='transaction'){let t=state.tx.find(t=>t.id===m.id);if(t){html=modal('Transaction details',t.id,`<div class="shift-row"><span>Customer / payee</span><b>${safe(t.who)}</b></div><div class="shift-row"><span>Amount</span><b>${currency(t.amount)}</b></div><div class="shift-row"><span>Method</span><b>${safe(t.method)}</b></div><div class="shift-row"><span>Date</span><b>${dateFmt(t.time)} · ${tm(t.time)}</b></div><div class="shift-row"><span>Status</span>${chip(t.status)}</div>${t.items?`<div style="margin-top:18px;font-weight:700;font-size:12px">Items</div>${t.items.map(a=>`<div class="shift-row"><span>${a.qty} × ${safe(a.name)}</span><b>${currency(a.qty*a.price)}</b></div>`).join('')}`:''}<div class="tip" style="margin-top:18px">${t.method==='M-PESA'?'Demo entry only. A real M-PESA payment must be verified through your authorized payment provider before fulfillment.':'All records here are simulated and not bank statements.'}</div>`,`<button class="btn" data-act="closeModal">Close</button>${t.status==='confirmed'&&t.kind==='sale'?`<button class="btn" data-act="printReceipt" data-id="${t.id}">${ic('print')} Receipt</button>`:''}${t.status==='pending'?`<button class="btn primary" data-act="confirmTx" data-id="${t.id}">Simulate confirmation</button>`:''}`)}}
else if(type==='newExpense'){html=modal('Record an expense','Add a business expense to your ledger.',`<div class="form-block"><label class="form-label">Payee / description</label><input class="field" id="expenseName" placeholder="e.g. Office supplies"></div><div class="form-row"><div class="form-block"><label class="form-label">Amount (KSh)</label><input type="number" min="1" class="field" id="expenseAmount" placeholder="0"></div><div class="form-block"><label class="form-label">Payment method</label><select id="expenseMethod" class="select"><option>Cash</option><option>M-PESA</option><option>Bank transfer</option></select></div></div><div class="form-block"><label class="form-label">Category</label><select id="expenseCategory" class="select"><option>Operations</option><option>Supplies</option><option>Rent</option><option>Transport</option><option>Other</option></select></div>`,cancel+'<button class="btn primary" data-act="saveExpense">Save expense</button>')}
else if(type==='customer'){let c=state.customers.find(c=>c.id===m.id)||{};html=modal(c.id?'Edit customer':'Add customer','Keep only the contact details your business needs.',`<div class="form-block"><label class="form-label">Full name</label><input class="field" id="customerName" value="${safe(c.name||'')}" placeholder="Customer name"></div><div class="form-block"><label class="form-label">Phone number</label><input class="field" id="customerPhone" value="${safe(c.phone||'')}" placeholder="07xx xxx xxx"></div><div class="form-block"><label class="form-label">Email (optional)</label><input class="field" id="customerEmail" value="${safe(c.email||'')}" placeholder="name@example.com"></div>`,cancel+'<button class="btn primary" data-act="saveCustomer">Save customer</button>')}
else if(type==='product'){let p=state.products.find(p=>p.id===m.id)||{};html=modal(p.id?'Edit '+template[state.type].item.toLowerCase():'Add '+template[state.type].item.toLowerCase(),'Manage what the business offers.',`<div class="form-block"><label class="form-label">${safe(template[state.type].item)} name</label><input class="field" id="productName" value="${safe(p.name||'')}" placeholder="Name"></div><div class="form-row"><div class="form-block"><label class="form-label">Price (KSh)</label><input type="number" min="0" class="field" id="productPrice" value="${p.price??''}"></div><div class="form-block"><label class="form-label">${state.type==='retail'?'Stock quantity':'Availability limit'}</label><input type="number" min="0" class="field" id="productStock" value="${p.stock??99}"></div></div>`,cancel+'<button class="btn primary" data-act="saveProduct">Save item</button>')}
else if(type==='staff'){let s=state.staff[m.index]||{};html=modal(s.name?'Edit team member':'Add team member','Demo directory. Server-side access control is not included.',`<div class="form-block"><label class="form-label">Name</label><input class="field" id="staffName" value="${safe(s.name||'')}"></div><div class="form-block"><label class="form-label">Job title</label><input class="field" id="staffRole" value="${safe(s.role||'')}"></div><div class="form-block"><label class="form-label">Suggested access</label><select class="select" id="staffAccess">${['Manager','Sales only','Inventory only','Reporting only'].map(a=>`<option ${s.access===a?'selected':''}>${a}</option>`).join('')}</select></div>`,cancel+'<button class="btn primary" data-act="saveStaff">Save member</button>')}
else if(type==='shift'){let t=totals();html=modal('End-of-day review','Reconcile cash received against cash counted.',`<div class="shift-row"><span>Confirmed M-PESA sales (demo)</span><b>${currency(t.mpesa)}</b></div><div class="shift-row"><span>Confirmed cash sales (demo)</span><b>${currency(t.cash)}</b></div><div class="shift-row"><span>Recorded cash expenses</span><b>${currency(state.tx.filter(x=>x.kind==='expense'&&x.method==='Cash').reduce((v,x)=>v+x.amount,0))}</b></div><div class="shift-row"><span>Payments not verified</span><b>${currency(t.pending)}</b></div><div class="form-block" style="margin-top:18px"><label class="form-label">Actual cash counted (KSh)</label><input type="number" id="actualCash" class="field" placeholder="Enter physical cash counted"></div><div class="tip">Cash variance assumes an opening float of KSh 0 for this demo. Live reconciliation requires the actual opening float, cash paid out, reversals and settlement data.</div>${state.close?`<div class="box-note" style="margin-top:12px">Last demonstration close: ${dateFmt(state.close.time)}, counted ${currency(state.close.actual)}, difference ${currency(state.close.variance)}</div>`:''}`,cancel+'<button class="btn primary" data-act="closeShift">Review variance & close</button>')}
else if(type==='confirm'){html=modal('Review payment','This is a simulation, not an M-PESA payment verification.',`<div class="box-note">Clicking the button will change a demo transaction to “Confirmed.” In production, confirmation must come from an authenticated provider or matched statement, not a staff button alone.</div>`,cancel+`<button class="btn primary" data-act="finalizeConfirm" data-id="${safe(m.id)}">Confirm in demo</button>`)}
else if(type==='reset'){html=modal('Reset the demo?','All edits to this sample workspace will be erased.',`<div class="box-note">This will restore sample products, customers, transactions and staff for the selected business type.</div>`,cancel+'<button class="btn danger" data-act="resetConfirm">Reset sample data</button>')}
else if(type==='notifications'){let t=totals();html=modal('Notifications','Things that need checking.',`<div class="notice-row"><span class="notice-icon">${ic('clock')}</span><div><strong>${t.pendingCount} pending payments</strong><p>Review and reconcile against your provider records.</p></div></div><div class="notice-row"><span class="notice-icon">${ic('box')}</span><div><strong>${state.products.filter(p=>p.stock<=10).length} low-stock items</strong><p>Check availability before selling.</p></div></div>`, '<button class="btn primary" data-act="notificationsView">View transactions</button>')}
}document.getElementById('portal').innerHTML=html+(ui.toast?`<div class="toast">${ic('check',16)}${safe(ui.toast)}</div>`:'')}
function get(id){return document.getElementById(id)?.value.trim()||''}function validate(cond,message){if(!cond){showToast(message);return false}return true}
function printReceipt(txid){let t=state.tx.find(t=>t.id===txid);if(!t||t.status!=='confirmed'||t.kind!=='sale')return;document.getElementById('receipt-print').innerHTML=`<h2>${safe(state.company)}</h2><p>${safe(state.branch)}</p><p>RECEIPT · SAMPLE / NOT A REAL PAYMENT</p><p>${safe(t.id)} | ${dateFmt(t.time)}</p><hr>${(t.items||[]).map(a=>`<p>${safe(a.name)} × ${a.qty} — ${currency(a.qty*a.price)}</p>`).join('')}<hr><h3>TOTAL ${currency(t.amount)}</h3><p>${safe(t.method)} · Confirmed in demo</p>`;window.print()}
function checkout(){let arr=ui.cart.map(c=>{let p=state.products.find(p=>p.id===c.id);return p?{id:p.id,name:p.name,price:p.price,qty:c.qty}:null}).filter(Boolean);if(!arr.length)return;let invalid=arr.find(i=>{let p=state.products.find(p=>p.id===i.id);return p.stock<i.qty});if(invalid){showToast('Not enough stock for '+invalid.name);return}let status=ui.posMethod==='Cash'?'confirmed':'pending';let amount=arr.reduce((sum,i)=>sum+i.price*i.qty,0),transaction={id:id('TX-'),who:ui.posCustomer||'Walk-in customer',amount,method:ui.posMethod,kind:'sale',status,time:stamp(),items:arr};state.tx.unshift(transaction);if(status==='confirmed')for(let it of arr){let p=state.products.find(p=>p.id===it.id);p.stock-=it.qty}save();ui.cart=[];ui.page='activity';ui.modal={type:'transaction',id:transaction.id};render();showToast(status==='confirmed'?'Cash sale saved in demo':'Pending payment created. Verification required')}
function action(a,d){if(a==='menu'){ui.mobile=!ui.mobile;render();return}if(a==='switch'){ui.modal={type:'switch'}}else if(a==='closeModal'){ui.modal=null}else if(a==='newSale'){goto('sell');return}else if(a==='newExpense'){ui.modal={type:'newExpense'}}else if(a==='addProduct'){ui.modal={type:'product'}}else if(a==='addCustomer'){ui.modal={type:'customer'}}else if(a==='addStaff'){ui.modal={type:'staff'}}else if(a==='shift'){ui.modal={type:'shift'}}else if(a==='notifications'){ui.modal={type:'notifications'}}else if(a==='notificationsView'){ui.modal=null;goto('activity');return}else if(a==='search'){ui.modal=null;goto('activity');setTimeout(()=>document.querySelector('[data-input=query]')?.focus(),100);return}else if(a==='clearCart'){ui.cart=[];render();return}else if(a==='checkout'){checkout();return}else if(a==='reset'){ui.modal={type:'reset'}}else if(a==='resetConfirm'){state=seed(state.type);save();ui.modal=null;goto('overview');showToast('Sample workspace restored');return}else if(a==='saveSettings'){if(!validate(get('businessName'),'Enter a business name'))return;state.company=get('businessName');state.branch=get('branchName')||'Main branch';save();render();showToast('Business details saved');return}else if(a==='saveExpense'){let name=get('expenseName'),amount=Number(get('expenseAmount'));if(!validate(name&&amount>0,'Enter an expense and positive amount'))return;state.tx.unshift({id:id('EX-'),who:name,amount,method:get('expenseMethod'),category:get('expenseCategory'),kind:'expense',status:'confirmed',time:stamp()});save();ui.modal=null;goto('expenses');showToast('Demo expense recorded');return}else if(a==='saveCustomer'){let name=get('customerName');if(!validate(name,'Customer name is required'))return;let c=state.customers.find(c=>c.id===ui.modal.id);if(c)Object.assign(c,{name,phone:get('customerPhone'),email:get('customerEmail')});else state.customers.push({id:id('C'),name,phone:get('customerPhone'),email:get('customerEmail')});save();ui.modal=null;goto('customers');showToast('Customer saved');return}else if(a==='saveProduct'){let name=get('productName'),price=Number(get('productPrice')),stock=Number(get('productStock'));if(!validate(name&&price>=0&&stock>=0,'Enter valid item details'))return;let p=state.products.find(p=>p.id===ui.modal.id);if(p)Object.assign(p,{name,price,stock});else state.products.push({id:id('P'),name,price,stock});save();ui.modal=null;goto('inventory');showToast('Item saved');return}else if(a==='saveStaff'){let name=get('staffName'),role=get('staffRole');if(!validate(name&&role,'Enter name and role'))return;let s={name,role,access:get('staffAccess')};if(Number.isInteger(ui.modal.index))state.staff[ui.modal.index]=s;else state.staff.push(s);save();ui.modal=null;goto('team');showToast('Team directory updated');return}else if(a==='confirmTx'){ui.modal={type:'confirm',id:d}}else if(a==='finalizeConfirm'){let t=state.tx.find(t=>t.id===d);if(t&&t.status==='pending'){let valid=(t.items||[]).every(it=>(state.products.find(p=>p.id===it.id)?.stock||0)>=it.qty);if(!valid){showToast('Insufficient stock: correct inventory before confirming');return}t.status='confirmed';t.confirmedAt=stamp();for(let it of t.items||[])state.products.find(p=>p.id===it.id).stock-=it.qty;save()}ui.modal={type:'transaction',id:d};render();showToast('Demo status updated. No actual payment verified');return}else if(a==='printReceipt'){printReceipt(d);return}else if(a==='closeShift'){let val=get('actualCash');if(!validate(val!==''&&Number(val)>=0,'Enter physical cash counted'))return;let t=totals(),out=state.tx.filter(x=>x.kind==='expense'&&x.status==='confirmed'&&x.method==='Cash').reduce((v,x)=>v+x.amount,0);let expected=t.cash-out;let variance=Number(val)-expected;state.close={time:stamp(),actual:Number(val),variance,expected};save();ui.modal=null;render();showToast(`Cash variance: ${currency(variance)} (demo only)`);return}else if(a==='export'){let rows=[['Reference','Date','Customer/Payee','Type','Method','Amount','Status'],...state.tx.map(t=>[t.id,t.time,t.who,t.kind,t.method,t.amount,t.status])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let x=document.createElement('a');x.href=url;x.download='one-demo-transactions.csv';x.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('Demo ledger exported');return}renderPortal()}

document.addEventListener('click',e=>{let el=e.target.closest('[data-page],[data-act],[data-business],[data-tx],[data-addcart],[data-qty],[data-editproduct],[data-editcustomer],[data-editstaff],[data-toggle]');if(!el)return;if(el.dataset.page){goto(el.dataset.page);return}if(el.dataset.act){action(el.dataset.act,el.dataset.id);return}if(el.dataset.business){if(state.type!==el.dataset.business){state=seed(el.dataset.business);save();ui.cart=[];ui.posMethod='Cash';ui.posCustomer='';ui.modal=null;goto('overview');showToast('Switched to '+template[state.type].name+' demo');}else{ui.modal=null;renderPortal()}return}if(el.dataset.tx){ui.modal={type:'transaction',id:el.dataset.tx};renderPortal();return}if(el.dataset.addcart){let p=state.products.find(p=>p.id===el.dataset.addcart);let c=ui.cart.find(c=>c.id===p.id);if(c){if(c.qty<p.stock)c.qty++}else if(p.stock>0)ui.cart.push({id:p.id,qty:1});render();return}if(el.dataset.qty){let [id,delta]=el.dataset.qty.split(':');let c=ui.cart.find(a=>a.id===id),p=state.products.find(a=>a.id===id);if(c){c.qty+=Number(delta);if(c.qty<=0)ui.cart=ui.cart.filter(a=>a!==c);else c.qty=Math.min(c.qty,p.stock)}render();return}if(el.dataset.editproduct){ui.modal={type:'product',id:el.dataset.editproduct};renderPortal();return}if(el.dataset.editcustomer){ui.modal={type:'customer',id:el.dataset.editcustomer};renderPortal();return}if(el.dataset.editstaff){ui.modal={type:'staff',index:Number(el.dataset.editstaff)};renderPortal();return}if(el.dataset.toggle){let k=el.dataset.toggle;state.config[k]=!state.config[k];save();render();showToast('Workspace preference saved')}});
document.addEventListener('input',e=>{if(e.target.dataset.input==='query'){let v=e.target.value;ui.query=v;let start=e.target.selectionStart;render();let input=document.querySelector('[data-input=query]');input?.focus();input?.setSelectionRange(start,start)}else if(e.target.dataset.input==='sellQuery'){let v=e.target.value;ui.sellQuery=v;let start=e.target.selectionStart;render();let input=document.querySelector('[data-input=sellQuery]');input?.focus();input?.setSelectionRange(start,start)}});document.addEventListener('change',e=>{let k=e.target.dataset.select;if(!k)return;ui[k]=e.target.value;render()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;renderPortal()}});render();
</script></body></html>
