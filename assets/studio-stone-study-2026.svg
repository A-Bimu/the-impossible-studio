<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 420" role="img" aria-labelledby="title desc"><title id="title">A study in balance</title><desc id="desc">Three organically shaped, naturally textured river stones in amethyst, limestone and deep plum, with editorial studio shadows and a hairline gold orbit.</desc><defs>
<linearGradient id="basalt" x1=".12" y1=".01" x2=".94" y2=".93"><stop stop-color="#896d8b"/><stop offset=".19" stop-color="#5a405e"/><stop offset=".45" stop-color="#34243d"/><stop offset=".83" stop-color="#1f192b"/><stop offset="1" stop-color="#140f1a"/></linearGradient>
<linearGradient id="chalk" x1=".16" y1="0" x2=".9" y2=".95"><stop stop-color="#fff9ee"/><stop offset=".24" stop-color="#ebe3da"/><stop offset=".58" stop-color="#c4b3b2"/><stop offset=".86" stop-color="#aa9398"/><stop offset="1" stop-color="#736871"/></linearGradient>
<radialGradient id="amethyst" cx=".26" cy=".08" r="1"><stop stop-color="#ba9ab4"/><stop offset=".26" stop-color="#76567f"/><stop offset=".66" stop-color="#4f3159"/><stop offset="1" stop-color="#2d1b39"/></radialGradient>
<filter id="rockgrain" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".11" numOctaves="4" seed="13" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="g"/><feComponentTransfer in="g"><feFuncA type="linear" slope=".27"/></feComponentTransfer><feBlend in="SourceGraphic" in2="g" mode="multiply"/></filter>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="6" dy="11" stdDeviation="13" flood-color="#28192e" flood-opacity=".21"/></filter>
<radialGradient id="floor"><stop stop-color="#3c2545" stop-opacity=".24"/><stop offset="1" stop-color="#3c2545" stop-opacity="0"/></radialGradient>
</defs>
<ellipse cx="216" cy="382" rx="192" ry="33" fill="url(#floor)"/>
