<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEBRA | Not Made to Blend In</title><style>body{font-family:Arial,sans-serif;background:#0d0d0d;color:white;display:grid;place-items:center;min-height:100vh}p{opacity:.7}#error{max-width:600px}</style></head><body><div id="status"><h1>ZEBRA</h1><p>Loading the approved interactive storefront...</p></div><script>
(async function(){try{const paths=Array.from({length:16},(_,i)=>'parts/'+String(i).padStart(2,'0')+'.txt');const blocks=await Promise.all(paths.map(p=>fetch(p).then(r=>{if(!r.ok)throw Error(p+' HTTP '+r.status);return r.text()})));const html=blocks.join('');document.open();document.write(html);document.close()}catch(e){document.getElementById('status').innerHTML='<h1>Preview unavailable</h1><p id="error">Open this project using an HTTP server or GitHub Pages, not a file:// URL. '+String(e.message).replaceAll('<','&lt;')+'</p>'}})();</script></body></html>
