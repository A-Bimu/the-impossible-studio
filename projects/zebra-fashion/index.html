<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZEBRA | Not Made to Blend In</title>
<style>
  :root{color-scheme:dark}
  body{font-family:Arial,Helvetica,sans-serif;background:#0d0d0d;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0;padding:28px}
  .loader{max-width:620px;width:100%}
  h1{font-family:Georgia,serif;font-size:44px;letter-spacing:-.05em;margin:0 0 6px}
  .tag{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#e0483f;margin-bottom:22px}
  p{opacity:.72;line-height:1.7;font-size:14px;margin:0 0 16px}
  .bar{height:3px;background:#242424;overflow:hidden;margin:22px 0 12px}
  .bar i{display:block;height:100%;width:0;background:#e0483f;transition:width .25s ease}
  .pct{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8a8a8a}
  #error{color:#ffb4ac}
  code{background:#1b1b1b;padding:2px 6px;font-size:12px}
  a{color:#fff}
</style>
</head>
<body>
<div class="loader" id="status" role="status" aria-live="polite">
  <h1>ZEBRA</h1>
  <div class="tag">Not made to blend in</div>
  <p>Loading the approved interactive storefront.</p>
  <div class="bar"><i id="bar"></i></div>
  <div class="pct" id="pct">0%</div>
</div>
<noscript><p>This storefront needs JavaScript. Open it with a modern browser.</p></noscript>
<script>
(function () {
  var PARTS = 16;
  var status = document.getElementById('status');
  var bar = document.getElementById('bar');
  var pct = document.getElementById('pct');
  function fail(message) {
    status.innerHTML = '<h1>ZEBRA</h1><div class="tag">Not made to blend in</div>' +
      '<p id="error">Preview unavailable. ' + String(message).replace(/</g, '&lt;') + '</p>' +
      '<p>Serve this folder over HTTP rather than opening the file directly, for example ' +
      '<code>python -m http.server 8000</code>, then visit <code>/projects/zebra-fashion/</code>. ' +
      'The same build runs unchanged on GitHub Pages.</p>' +
      '<p><a href="README.md">Read the project notes</a></p>';
  }
  function getPart(i) {
    var name = 'parts/' + String(i).padStart(2, '0') + '.txt';
    return fetch(name, { cache: 'force-cache' }).then(function (r) {
      if (!r.ok) throw new Error(name + ' returned HTTP ' + r.status);
      return r.text();
    }).catch(function (err) {
      // one retry, in case a chunk was dropped on a slow connection
      return fetch(name).then(function (r) {
        if (!r.ok) throw err;
        return r.text();
      });
    });
  }
  (async function () {
    try {
      var blocks = new Array(PARTS);
      var loaded = 0;
      await Promise.all(Array.from({ length: PARTS }, function (_, i) {
        return getPart(i).then(function (text) {
          blocks[i] = text;
          loaded++;
          var done = Math.round((loaded / PARTS) * 100);
          bar.style.width = done + '%';
          pct.textContent = done + '%';
        });
      }));
      var html = blocks.join('');
      if (html.indexOf('<html') === -1) throw new Error('The assembled storefront is incomplete.');
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      fail(e && e.message ? e.message : e);
    }
  })();
})();
</script>
</body>
</html>
