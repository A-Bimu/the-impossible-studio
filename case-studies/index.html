<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project story | The Impossible Studio</title><meta name="description" content="Explore the original design, concept, process and live interactive experience in The Impossible Studio."><link rel="stylesheet" href="../studio.css"></head><body><header class="top shell"><a class="wordmark" href="../">THE IMPOSSIBLE<br>STUDIO<i>.</i></a><nav><a href="../#work">Selected work</a><a href="../#archive">Archive</a><a href="../#daily">Daily designs</a><a href="../#about">About</a></nav><a href="../" class="contact">All projects ↗</a></header><main id="story"></main><footer class="foot shell"><div><a class="wordmark" href="../">THE IMPOSSIBLE<br>STUDIO<i>.</i></a><p><small>One project at a time. One story at a time.</small></p></div><div class="links"><a href="../">All work</a><a href="https://github.com/A-Bimu/the-impossible-studio">Source archive</a></div></footer><script>
const projects={
'cloud-cart':{title:'Cloud Cart',tag:'01 / E-commerce, product identity and creative direction',subtitle:'Everyday essentials, a little lighter.',hero:'../assets/cloud-milk-hero.webp',heroAlt:'Photographic milk carton resting on clouds',intro:'A retail concept that pairs familiar, real products with surreal but believable cloud staging. The merchandise is always identifiable, priced and easy to shop.',approach:'The product comes first. Milk must look like milk, bread like bread, and a shopper must know what they are buying. The cloud is the visual stage, not a substitute for the item. A clear catalogue, visible Kenyan-shilling prices and a working concept cart bring the world into focus.',categories:'Retail · Landing page · E-commerce',deliverables:'Brand direction, responsive storefront, pricing, category navigation, simulated cart',status:'Redesigned interactive concept · Checkout simulated',original:'../assets/cloud-cart-original-archive.webp',originalCaption:'Earlier, approved Cloud Cart artwork: the original floating trolley presentation, retained as part of the project history.',second:'../assets/cloud-milk-side.webp',secondCaption:'New art direction: tangible milk packaging presented on a cloud instead of cartoon grocery symbols.',demo:'../projects/cloud-cart/',button:'Explore the redesigned store',galleryCaption:'The new approach moves from a surreal visual metaphor to a credible, shoppable retail experience.'},
'zebra':{title:'ZEBRA',tag:'02 / Fashion commerce and visual identity',subtitle:'Not made to blend in.',hero:'../assets/zebra-original.webp',heroAlt:'Full original ZEBRA fashion landing page with zebras crossing an urban street',intro:'A fictional fashion label that refuses to disappear into the crowd. The original zebra-crossing photograph turns a common city scene into a campaign for individuality.',approach:'The contrast of zebra markings becomes the visual code. The street-crossing scene sets the tone while the collection pages make the brand usable, not just beautiful. Bold typography, fashion editorial imagery and an interactive storefront carry the idea forward.',categories:'Fashion · Branding · Digital commerce',deliverables:'Original hero campaign, product collection, interactive storefront, simulated checkout',status:'Approved original · Interactive prototype',original:'../assets/zebra-original.webp',originalCaption:'The original approved landing page, including the campaign hero and Stripes Collection.',second:'../assets/zebra-cover.webp',secondCaption:'A closer look at the campaign opening: a street crossing turned into a brand statement.',demo:'../projects/zebra-fashion/',button:'Open the original ZEBRA storefront',galleryCaption:'The design joins the theatrical opening image to a practical collection experience.'},
'deep-ink':{title:'Deep Ink',tag:'03 / Interactive art direction and motion',subtitle:'Ideas have a way of escaping.',hero:'../assets/deep-ink-original.webp',heroAlt:'Original Deep Ink presentation board showing octopus desktop, mobile and interaction concepts',intro:'An immersive blue-and-porcelain visual world led by an octopus that changes the way a user experiences scrolling, navigation and discovery.',approach:'Instead of describing motion with generic transitions, the creature becomes part of the interface. Tentacles guide the eye across sections and the design plays between elegant editorial typography and textured deep-sea artwork. Original approved concepts are preserved.',categories:'Immersive web · Illustration · Motion',deliverables:'Original illustrated concepts, desktop/mobile exploration, two approved scrolling video studies',status:'Approved original art · Two original motion videos',original:'../assets/deep-ink-original.webp',originalCaption:'Full original project board: desktop flow, mobile sample and the intended hover, menu and scroll interactions.',second:'../assets/deep-ink-cover.webp',secondCaption:'Porcelain-blue illustration from the approved concept.',demo:'../projects/deep-ink/',button:'Open the Deep Ink originals',galleryCaption:'Scroll through the visual direction and then see the two genuine motion studies from the archive.'}};
let key=new URLSearchParams(location.search).get('project'),p=projects[key];if(!p){location.replace('../#work')}else{document.title=p.title+' | The Impossible Studio';const others=Object.entries(projects).filter(([id])=>id!==key);const iframe=key==='deep-ink'?'../projects/deep-ink/videos/':p.demo;const content=`<section class="casehero shell"><a href="../#work" class="arrow-link">← Back to the studio</a><div class="caseintro"><div><div class="eyebrow">${p.tag}</div><h1>${p.title}</h1><p class="serif">${p.subtitle}</p></div><aside><b>The Impossible Studio / Case study</b>Original designs, exploration and working demos in one scrollable presentation.</aside></div><img class="casehero-img ${key==='deep-ink'?'tall':''}" src="${p.hero}" alt="${p.heroAlt}"></section><div class="shell casebody"><div class="case-summary"><div><div class="caselabel">01 / The story</div><h2 class="section-title">Behind the idea.</h2></div><p>${p.intro}</p></div><div class="metrics"><div><span>Discipline</span><strong>${p.categories}</strong></div><div><span>What was made</span><strong>${p.deliverables}</strong></div><div><span>Project status</span><strong>${p.status}</strong></div></div><section class="story-block"><div class="caselabel">02 / The thinking</div><h2 class="section-title">A concept with a purpose.</h2><p class="section-text">${p.approach}</p><div class="twocol"><figure style="margin:0"><img src="${p.second}" alt="${p.secondCaption}" loading="lazy"><figcaption class="captionline"><span>${p.secondCaption}</span><span>01</span></figcaption></figure><figure style="margin:0"><img src="${p.original}" style="object-fit:contain;background:#f4eee6" alt="${p.originalCaption}" loading="lazy"><figcaption class="captionline"><span>${p.originalCaption}</span><span>02</span></figcaption></figure></div></section><section class="story-block"><div class="caselabel">03 / The presentation</div><h2 class="section-title">The work, as it was made.</h2><p class="section-text">${p.galleryCaption}</p><img src="${p.original}" class="large-image" loading="lazy" alt="Original ${p.title} full presentation image"><div class="captionline"><span>${p.originalCaption}</span><span>Original artwork</span></div></section><section class="interactive"><div class="interactive-head"><div><div class="caselabel">04 / In action</div><h2 class="section-title">Explore the experience.</h2><p class="section-text">${key==='deep-ink'?'A real archived scrolling video appears after the presentation, followed by a second concept video.':'This is a real interactive demonstration. Purchases, where shown, are simulated.'}</p></div><div class="casebuttons"><a class="btn white" target="_blank" rel="noopener" href="${p.demo}">${p.button} ↗</a>${key==='deep-ink'?'<a class="btn" href="../projects/deep-ink/videos/concept-02.html" target="_blank" rel="noopener">Second motion video ↗</a>':''}</div></div><iframe class="${key==='deep-ink'?'video-frame':'demo-frame'}" loading="lazy" title="${p.title} interactive presentation" src="${iframe}" allowfullscreen></iframe><p class="honest">${key==='deep-ink'?'The genuine archived motion study may need a moment to reconstruct from its stored parts. Tap Play if it does not start automatically.':'This preview is the actual interactive prototype. Use the full-screen link for the best experience.'}</p></section><div class="navigation-bottom"><a href="../#work">← All projects</a><a href="?project=${others[0][0]}">Next: ${others[0][1].title} →</a></div></div>`;document.querySelector('#story').innerHTML=content}
</script></body></html>
