name: AGRI AI responsive research-led prototype checks
on:
  pull_request:
    paths:
      - 'projects/agri-ai/**'
      - 'work/agri-ai/**'
      - 'assets/agri-ai.css'
      - 'assets/agri-ai.js'
      - 'assets/agri-ai-case.css'
      - 'tests/studio-agri-ai.test.mjs'
      - 'scripts/agri-ai-browser-qa.mjs'
      - 'index.html'
      - 'daily/index.html'
      - 'presentations/index.html'
      - '.github/workflows/agri-ai-site.yml'
  push:
    branches: [main]
    paths:
      - 'projects/agri-ai/**'
      - 'work/agri-ai/**'
      - 'assets/agri-ai.css'
      - 'assets/agri-ai.js'
      - 'assets/agri-ai-case.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/studio-agri-ai.test.mjs tests/studio-mova-on-hold.test.mjs
  real-browser-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright
        run: npm install --prefix .studio-qa-tools --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        run: .studio-qa-tools/node_modules/.bin/playwright install chromium
      - name: Start local static website
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/agri-ai-http.log 2>&1 &
          sleep 2
      - name: Verify realistic mobile and laptop interactions
        run: node scripts/agri-ai-browser-qa.mjs
      - name: Archive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agri-ai-desktop-mobile-qa
          path: artifacts/agri-ai/
          retention-days: 7
          if-no-files-found: warn
