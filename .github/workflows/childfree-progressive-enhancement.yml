name: Childfree progressive enhancement regression

on:
  push:
    paths:
      - 'work/childfree/index.html'
      - 'tests/childfree-progressive-enhancement.test.mjs'
      - '.github/workflows/childfree-progressive-enhancement.yml'
  pull_request:
    paths:
      - 'work/childfree/index.html'
      - 'tests/childfree-progressive-enhancement.test.mjs'
      - '.github/workflows/childfree-progressive-enhancement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Childfree source regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Childfree progressive enhancement tests
        run: node --test tests/childfree-progressive-enhancement.test.mjs
