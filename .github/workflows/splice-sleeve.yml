name: SPLICE draft sleeve checks
on:
  pull_request:
    paths:
      - 'drafts/2026-11-01-splice/**'
      - 'tests/splice-sleeve.test.mjs'
      - '.github/workflows/splice-sleeve.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/splice-sleeve.test.mjs
  browser:
    name: Chromium interaction and mobile layout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check editing, SVG export and mobile layouts
        env:
          SPLICE_QA_SCREENSHOTS: ${{ runner.temp }}/splice-review
        run: node --test drafts/2026-11-01-splice/browser.test.mjs
      - name: Attach screenshots for owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splice-desktop-mobile-review
          path: ${{ runner.temp }}/splice-review/*.png
          if-no-files-found: warn
          retention-days: 7
