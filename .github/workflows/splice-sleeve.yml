name: SPLICE draft sleeve checks
on:
  pull_request:
    paths:
      - 'drafts/2026-11-01-splice/**'
      - 'tests/splice-sleeve.test.mjs'
      - '.github/workflows/splice-sleeve.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/splice-sleeve.test.mjs
