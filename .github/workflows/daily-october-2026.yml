name: Studio October daily designs
on:
  pull_request:
    paths:
      - 'daily/**'
      - 'tests/daily-october-2026.test.mjs'
      - 'tests/nocturne-confirmation-focus.test.mjs'
      - '.github/workflows/daily-october-2026.yml'
  push:
    branches: [main]
    paths:
      - 'daily/**'
      - 'tests/daily-october-2026.test.mjs'
      - 'tests/nocturne-confirmation-focus.test.mjs'
jobs:
  verify-daily:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/daily-october-2026.test.mjs tests/nocturne-confirmation-focus.test.mjs
