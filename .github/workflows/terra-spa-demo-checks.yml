# Read-only checks for the fictional TERRA Spa design draft.
# No merge, deployment, publication or production configuration changes.
name: TERRA Spa demo checks

on:
  pull_request:
    paths:
      - 'drafts/2026-10-28-terra-spa/**'
      - '.github/workflows/terra-spa-demo-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terra-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse the module
        run: node --check drafts/2026-10-28-terra-spa/app.mjs
      - name: Test schedule and booking rules
        run: node --test drafts/2026-10-28-terra-spa/app.test.mjs

  terra-browser:
    name: Chromium interaction and narrow-screen smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright test runner
        run: npm install --no-save --no-package-lock playwright@1.56.0
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run real-browser smoke checks and capture review images
        env:
          TERRA_QA_SCREENSHOTS: ${{ runner.temp }}/terra-spa-qa
        run: node --test drafts/2026-10-28-terra-spa/browser.test.mjs
      - name: Attach desktop, tablet and mobile screenshots for creative review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terra-spa-visual-review
          path: ${{ runner.temp }}/terra-spa-qa/*.png
          if-no-files-found: warn
          retention-days: 7
