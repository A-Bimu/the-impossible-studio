name: Childfree collection checks
on:
  pull_request:
    paths:
      - 'work/childfree/**'
      - 'tests/childfree-collection.test.mjs'
      - 'tests/childfree-dialog-navigation.test.mjs'
      - '.github/workflows/childfree-collection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/childfree-collection.test.mjs tests/childfree-dialog-navigation.test.mjs
