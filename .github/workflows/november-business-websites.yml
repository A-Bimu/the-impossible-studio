name: November business website regression checks
on:
  pull_request:
    paths:
      - 'projects/stockwise/**'
      - 'projects/vela-health/**'
      - 'projects/mova/**'
      - 'work/stockwise/**'
      - 'work/vela-health/**'
      - 'work/mova/**'
      - 'assets/business-websites-showcase.css'
      - 'presentations/index.html'
      - 'daily/index.html'
      - 'index.html'
      - 'tests/studio-november-business-websites.test.mjs'
      - '.github/workflows/november-business-websites.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/studio-november-business-websites.test.mjs
