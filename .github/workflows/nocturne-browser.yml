name: Hotel Nocturne browser regression
on:
  pull_request:
    paths:
      - 'daily/2026-10-31-night-shift/**'
      - 'tests/nocturne-browser.test.mjs'
      - '.github/workflows/nocturne-browser.yml'
  push:
    branches: [main]
    paths:
      - 'daily/2026-10-31-night-shift/**'
      - 'tests/nocturne-browser.test.mjs'
      - '.github/workflows/nocturne-browser.yml'

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify real Chromium interactions at mobile widths
        run: node --test tests/nocturne-browser.test.mjs
