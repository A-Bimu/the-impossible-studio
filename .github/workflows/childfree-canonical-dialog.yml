name: Childfree canonical dialog checks
on:
  pull_request:
    paths:
      - 'work/childfree/**'
      - 'tests/childfree-canonical-dialog.test.mjs'
      - '.github/workflows/childfree-canonical-dialog.yml'
  push:
    branches:
      - 'studio/childfree-dialog-paging-canonical-20261030'
permissions:
  contents: read
jobs:
  dialog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify filtered dialog paging and focus
        run: node --test tests/childfree-canonical-dialog.test.mjs
